name: Tunnel

# 代理跑在 GitHub Actions runner 上 —— 公开仓库的 Actions 不收钱，
# 于是「代理必须待在一台你自己的机器上」这个依赖就没有了。
#
# 前面挂一条 Cloudflare 隧道对外暴露，隧道地址写进 runtime 分支的 tunnel-url 文件。
# Worker 通过 UPSTREAM_POINTER 读那个文件，所以隧道换地址时
# 不用重新部署任何东西 —— Worker 30 秒内自己跟上。
#
# 调度：**靠上一轮自己叫起下一轮**，不靠 GitHub 的 cron。
# 实测这个仓库的 schedule 一直没触发（2026-11-20，12:17Z 和 16:17Z 两个时点
# 都没跑），所以 cron 只留作兜底 —— 万一哪天它醒了，还得能跟自续链共存而不打架。

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      takeover:
        description: 'auto = 当前隧道还活着就退位；always = 无条件接管'
        type: choice
        default: auto
        options:
          - auto
          - always
      handoff_now:
        description: '立刻交接：起完隧道就叫下一轮（指针立刻交给它），本轮继续活着当备用'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# 不做并发分组：新一轮要能**和**上一轮并存。
# 下一轮的隧道起来、指针指过去之后，上一轮还活着 1.5 小时才自然结束 ——
# 这段时间两个隧道都在跑，所以交接时站点没有空窗。
# （同一组名字 + cancel-in-progress:false 反而会让新一轮排队 5.5 小时。）

jobs:
  tunnel:
    name: 代理 + 隧道
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 看当前隧道是不是还活着
        id: current
        run: |
          # takeover=auto 是「兜底」那一类触发（cron、或者人手 dispatch）：
          # 当前指针上的隧道还活着，就说明已经有一条链在跑 —— 退位，别抢指针。
          # 不这么做的话，自续链和 cron 各带一条链，两边互相抢指针。
          # takeover=always 是接班：上一轮点名叫来的，无条件接管。
          if [ "${{ inputs.takeover }}" = "always" ]; then
            echo 'mode=always —— 接班，无条件接管'
            echo "mode=always" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          CUR=$(curl -sS --max-time 15 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/runtime/tunnel-url?t=$(date +%s)" \
            2>/dev/null | tr -d '[:space:]')
          set -e
          if [ -n "$CUR" ] && curl -sSf --max-time 20 "$CUR/__ping" > /dev/null 2>&1; then
            echo "当前隧道还活着：$CUR —— 退位，不抢指针"
            echo "mode=stand-down" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=takeover —— 当前隧道不在了，接管"
          echo "mode=takeover" >> "$GITHUB_OUTPUT"

      - name: 装 cloudflared
        if: steps.current.outputs.mode != 'stand-down'
        run: |
          curl -sSL -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: 起本地代理
        if: steps.current.outputs.mode != 'stand-down'
        env:
          API_KEY: ${{ secrets.VITE_API_KEY }}
        run: |
          set -euo pipefail
          node proxy/server.mjs > proxy.log 2>&1 &
          echo $! > proxy.pid
          sleep 3
          curl -sSf --max-time 30 http://127.0.0.1:8787/__ping | tee proxy-ping.json
          # runner 连不上源站就直接失败 —— 别让一个「隧道起来了但打不通」的假成功混过去
          grep -q '"reachable": true' proxy-ping.json

      - name: 缓存 pip 下载
        if: steps.current.outputs.mode != 'stand-down'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-doc-${{ runner.os }}-${{ hashFiles('proxy/requirements-doc.txt') }}

      - name: 装文档服务依赖（可选）
        if: steps.current.outputs.mode != 'stand-down'
        # ★ 装不上也不能让这一轮挂掉 —— 隧道断了就是全站下线。
        #   认字和读文档这两个工具会回一句「文档服务没开」，别的照常用。
        continue-on-error: true
        run: |
          python3 -m pip install --break-system-packages --disable-pip-version-check \
            -r proxy/requirements-doc.txt

      - name: 起文档服务（可选）
        if: steps.current.outputs.mode != 'stand-down'
        continue-on-error: true
        run: |
          nohup python3 proxy/doc_service.py --port 8788 > doc.log 2>&1 &
          echo $! > doc.pid
          sleep 5
          if curl -sSf --max-time 10 http://127.0.0.1:8788/health > /dev/null; then
            echo '文档服务起来了'
          else
            echo '::warning::文档服务没起来 —— 认字和读文档这两个工具暂时用不了'
            tail -20 doc.log || true
          fi

      - name: 起隧道
        id: tunnel
        if: steps.current.outputs.mode != 'stand-down'
        run: |
          cloudflared tunnel --url http://127.0.0.1:8787 --no-autoupdate > tunnel.log 2>&1 &
          echo $! > tunnel.pid
          for i in $(seq 1 30); do
            grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1 > tunnel-url.txt || true
            [ -s tunnel-url.txt ] && break
            sleep 2
          done
          if [ ! -s tunnel-url.txt ]; then
            echo '隧道没起来'; cat tunnel.log; exit 1
          fi
          URL=$(cat tunnel-url.txt)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "隧道地址: $URL"

      - name: 把隧道地址写进 runtime 分支
        if: steps.current.outputs.mode != 'stand-down'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/contents/tunnel-url"
          CONTENT=$(printf '%s' "$URL" | base64 -w0)
          # 更新已存在的文件必须带它当前的 blob sha —— 少了这个 API 会静默地不写
          SHA=$(curl -sSf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API?ref=runtime" | jq -r '.sha')
          printf '{"message":"chore: 更新隧道地址","branch":"runtime","content":"%s","sha":"%s"}' \
            "$CONTENT" "$SHA" > payload.json
          curl -sSf -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API?ref=runtime" -d @payload.json | jq -r '.content.path + " @ " + .commit.sha'
          # 写完立刻读回来核对 —— 确认 Worker 下一轮能读到的是新地址
          curl -sSf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
            "$API?ref=runtime"
          echo "隧道地址: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: 保持进程活着
        if: steps.current.outputs.mode != 'stand-down'
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_NOW: ${{ inputs.handoff_now }}
        run: |
          set -uo pipefail

          # 叫起下一轮。workflow_dispatch 不受「GITHUB_TOKEN 触发的事件不产生新 run」
          # 那条限制 —— GitHub 明确把 workflow_dispatch 和 repository_dispatch 排除在外，
          # 所以用仓库自带的 token 就够，不用另外配 PAT。
          # takeover=always：接班的那一轮不许再「看隧道还活着就退位」。
          dispatch_next() {
            curl -sSf -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/tunnel.yml/dispatches" \
              -d '{"ref":"main","inputs":{"takeover":"always"}}'
          }

          # 本轮活到 job 的 timeout（330 分钟）为止，但**提前 90 分钟**叫下一轮 ——
          # 新旧两轮重叠 90 分钟，站点没有空窗。
          # （330 是这个 job 的 timeout，两个数字要一起改。）
          DEADLINE=$(( $(date +%s) + (330*60 - 90*60) ))
          handed=0
          while true; do
            sleep 300
            if ! kill -0 "$(cat proxy.pid)" 2>/dev/null; then echo '代理挂了'; exit 1; fi
            if ! kill -0 "$(cat tunnel.pid)" 2>/dev/null; then echo '隧道挂了'; exit 1; fi
            if [ "$handed" = "0" ]; then
              if [ "$HANDOFF_NOW" = "true" ]; then
                echo '手动交接：立刻叫下一轮'
                handed=1
              elif [ "$(date +%s)" -ge "$DEADLINE" ]; then
                echo '到交接时点，叫下一轮'
                handed=1
              fi
              if [ "$handed" = "1" ]; then
                if dispatch_next; then
                  echo '下一轮已叫起'
                else
                  echo '::warning::叫下一轮失败 —— 本轮结束后站点会断，靠 cron 或手动 dispatch 兜底'
                fi
              fi
            fi
          done
