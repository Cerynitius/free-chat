name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Expected behaviour versus actual behaviour.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings and pick connection mode "Proxy"
        2. Enter the proxy URL
        3. Send the message "hi"
        4. See ...
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Connection mode
      options:
        - Proxy (local Node proxy / Cloudflare Worker)
        - Direct to the upstream origin
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser and OS
      options:
        - Chrome on Windows
        - Chrome on macOS
        - Chrome on Android
        - Safari on iOS
        - Firefox on Linux
        - Other

  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Open DevTools, go to the Console tab, and paste what you see.
      render: text

  - type: checkboxes
    id: no-key
    attributes:
      label: Checklist
      options:
        - label: I did not paste an API key into this report.